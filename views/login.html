<div class="login-card">
  <div class="brand-header">
    <div class="logo-circle">🚌</div>
    <span class="system-status-pill">● Sistema Activo</span>
    <h1>SafeDrive IA</h1>
    <p>Monitoreo inteligente de fatiga vehicular — ETSJL S.A.C.</p>
  </div>

  <div class="login-body">
    <h2>Bienvenido</h2>
    <p class="subtitle">Inicia sesión para continuar tu servicio</p>

    <div class="role-selector">
      <button type="button" id="btnRoleConductor" class="role-btn active">Conductor</button>
      <button type="button" id="btnRoleSupervisor" class="role-btn">Supervisor</button>
    </div>

    <form id="formLogin">
      <div class="form-group">
        <label for="inputDni">USUARIO / DNI</label>
        <input type="text" id="inputDni" placeholder="Ej. 76543210" value="76543210" required />
      </div>

      <div class="form-group">
        <label for="inputPassword">CONTRASEÑA</label>
        <input type="password" id="inputPassword" placeholder="••••••••" value="123456" required />
      </div>

      <button type="submit" class="btn-primary w-100">INGRESAR AL SISTEMA</button>
    </form>
    <p class="footer-link">Caso de estudio: San Juan de Lurigancho (2026)</p>
  </div>
</div>
