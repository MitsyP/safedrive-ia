<div class="mobile-container">
  <header class="app-header">
    <h2>Configuración</h2>
    <p class="text-muted">Ajustes del sistema de detección (rol: administrador)</p>
  </header>

  <div class="config-section">
    <h4>SENSIBILIDAD DE DETECCIÓN</h4>
    <label>Umbral EAR (apertura de ojo): <strong id="valEar">0.22</strong></label>
    <input type="range" min="0.15" max="0.30" step="0.01" value="0.22" id="rangeEar" />

    <label class="mt-2">Tiempo mínimo de alerta: <strong>2.0 s</strong></label>
    <input type="range" min="1.0" max="5.0" step="0.5" value="2.0" />
  </div>

  <div class="config-section mt-2">
    <h4>NOTIFICACIONES</h4>
    <label class="switch-row">
      <span>Alerta sonora al conductor</span>
      <input type="checkbox" checked />
    </label>
    <label class="switch-row">
      <span>Notificar al supervisor</span>
      <input type="checkbox" checked />
    </label>
  </div>

  <button id="btnSaveConfig" class="btn-success w-100 mt-auto">
    Guardar y Regresar
  </button>
</div>
