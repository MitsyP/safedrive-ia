<div class="supervisor-layout">
  <aside class="sidebar">
    <div class="brand"><span class="logo">🚌</span><h2>SafeDrive IA</h2></div>
    <nav class="nav-menu">
      <a href="#" id="menuDash" class="nav-item">📊 Panel General</a>
      <a href="#" id="menuReportes" class="nav-item active">📈 Reportes</a>
    </nav>
    <button id="btnSupervisorLogout" class="btn-logout">Cerrar Sesión</button>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <h1>Reportes y Estadísticas de Flota</h1>
      <div class="btn-group">
        <button class="btn-sm active">Semana</button>
        <button class="btn-sm">Mes</button>
      </div>
    </div>

    <div class="dashboard-split">
      <div class="panel-box">
        <h3>Alertas por Día (Últimos 7 días)</h3>
        <div class="bar-chart-mock">
          <div class="bar-col"><div class="bar" style="height: 50%;">3</div><span>Lun</span></div>
          <div class="bar-col"><div class="bar" style="height: 80%;">5</div><span>Mar</span></div>
          <div class="bar-col"><div class="bar" style="height: 35%;">2</div><span>Mié</span></div>
          <div class="bar-col"><div class="bar red" style="height: 100%;">6</div><span>Jue</span></div>
          <div class="bar-col"><div class="bar" style="height: 65%;">4</div><span>Vie</span></div>
          <div class="bar-col"><div class="bar" style="height: 20%;">1</div><span>Sáb</span></div>
        </div>
      </div>

      <div class="panel-box">
        <h3>Tipos de Eventos</h3>
        <ul class="activity-feed">
          <li><strong>55%</strong> Microsueño (Ojos cerrados)</li>
          <li><strong>30%</strong> Bostezo sostenido</li>
          <li><strong>15%</strong> Inclinación de cabeza</li>
        </ul>
      </div>
    </div>
  </main>
</div>
