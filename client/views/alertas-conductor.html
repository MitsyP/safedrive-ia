<div class="mobile-container">
  <header class="app-header">
    <h2>Historial de alertas</h2>
    <p class="text-muted">Registro de eventos de fatiga detectados</p>
  </header>

  <div class="kpi-three-grid">
    <div class="kpi-box"><span class="val text-red">3</span><span class="lbl">HOY</span></div>
    <div class="kpi-box"><span class="val">12</span><span class="lbl">ESTA SEMANA</span></div>
    <div class="kpi-box"><span class="val text-green">1.2s</span><span class="lbl">REACCIÓN PROM.</span></div>
  </div>

  <div class="history-list mt-2">
    <div class="history-item warn">
      <div class="icon">⏱</div>
      <div class="info">
        <strong>Microsueño detectado</strong>
        <small>Duración: 3.2s · Alerta sonora activada</small>
      </div>
      <span class="time">08:12 AM</span>
    </div>

    <div class="history-item">
      <div class="icon">🥱</div>
      <div class="info">
        <strong>Bostezo frecuente</strong>
        <small>3 bostezos en 5 minutos</small>
      </div>
      <span class="time">10:45 AM</span>
    </div>
  </div>

  <button id="btnBackToMonitoreo" class="btn-primary w-100 mt-auto">
    ⬅ Volver a Monitoreo en Vivo
  </button>
</div>
